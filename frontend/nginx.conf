server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/rss+xml application/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # ES module scripts. nginx's stock mime.types has no .mjs entry, so pdf.js's
    # worker (pdf.worker.min-*.mjs) went out as application/octet-stream, and
    # browsers refuse to run a module script of any type but JavaScript -- which
    # left every PDF in the reader unable to render. The empty types block makes
    # default_type the answer for this location only.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets (versioned files like *.abc123.js)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML (always fetch latest)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
