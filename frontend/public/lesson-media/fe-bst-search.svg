<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Searching a binary search tree for 7"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Searching a binary search tree for 7</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Every comparison discards a whole subtree.</text><rect x="28.0" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="123.75" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">At 8</text><text x="123.75" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">7 &lt; 8, go left</text><line x1="224.5" y1="135.0" x2="240.5" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="245.5" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="245.5" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="341.25" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">At 3</text><text x="341.25" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">7 &gt; 3, go right</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="558.75" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">At 6</text><text x="558.75" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">7 &gt; 6, go right</text><line x1="659.5" y1="135.0" x2="675.5" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="680.5" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="680.5" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="776.25" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">At 7</text><text x="776.25" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">found</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The ordering rule -- everything left of a node is smaller, everything right is larger -- is what makes this possible. Lose the balance and the tree degenerates into a linked list, and the search degrades from logarithmic to linear.</text></svg>