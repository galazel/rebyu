<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Each specification has a matching test"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="454" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Each specification has a matching test</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The V-model, and the pairing that makes it useful.</text><rect x="28.0" y="92" width="409.0" height="242" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="409.0" height="40" rx="12" fill="#ff9600"/><rect x="28.0" y="118" width="409.0" height="14" fill="#ff9600"/><text x="232.5" y="118" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Specifying -- going down</text><rect x="42.0" y="144" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="166" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">System requirements</text><text x="232.5" y="183" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">what the business needs</text><rect x="42.0" y="206" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="228" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Software requirements</text><text x="232.5" y="245" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">what the software must do</text><rect x="42.0" y="268" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="290" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Design</text><text x="232.5" y="307" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">how it is structured</text><text x="232.5" y="354" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">Each level defines the next</text><rect x="463.0" y="92" width="409.0" height="242" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="92" width="409.0" height="40" rx="12" fill="#1b6ef3"/><rect x="463.0" y="118" width="409.0" height="14" fill="#1b6ef3"/><text x="667.5" y="118" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Verifying -- coming up</text><rect x="477.0" y="144" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="166" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Unit test</text><text x="667.5" y="183" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">against the design</text><rect x="477.0" y="206" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="228" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Integration test</text><text x="667.5" y="245" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">against the software requirements</text><rect x="477.0" y="268" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="290" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Acceptance test</text><text x="667.5" y="307" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">against the business need</text><text x="667.5" y="354" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">Each level tested against its own spec</text><rect x="28" y="368" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="396" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The pairing is the point rather than the shape: acceptance testing checks the BUSINESS requirement and unit testing checks the design, so a test at the wrong level proves the wrong thing.</text></svg>