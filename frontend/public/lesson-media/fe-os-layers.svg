<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Where the operating system sits"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="374" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Where the operating system sits</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Each layer uses only the one below it.</text><rect x="28" y="88" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="88" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="116.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Applications</text><text x="656" y="116.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">what the user runs</text><rect x="28" y="142" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="142" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="170.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">System call interface</text><text x="656" y="170.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">the only way in</text><rect x="28" y="196" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="196" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="224.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Kernel: processes, memory, files, devices</text><text x="656" y="224.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">privileged</text><rect x="28" y="250" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="250" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="278.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Device drivers</text><text x="656" y="278.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">hardware-specific</text><rect x="28" y="304" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="304" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="332.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Hardware</text><text x="656" y="332.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">processor, memory, devices</text><rect x="688" y="88" width="184" height="262" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="780" y="114" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">The system call interface</text><text x="780" y="130" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">is the security boundary.</text><text x="780" y="146" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">Above it code runs</text><text x="780" y="162" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">unprivileged; below it,</text><text x="780" y="178" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">code can do anything.</text></svg>