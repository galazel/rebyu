<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Three ways floating-point arithmetic loses information"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="358" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Three ways floating-point arithmetic loses information</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">All three are properties of finite precision, not bugs.</text><rect x="28.0" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="266.6666666666667" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="266.6666666666667" height="16" fill="#1cb0f6"/><text x="161.33333333333334" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Cancellation</text><text x="161.33333333333334" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">significant digits lost</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Subtracting two nearly equal numbers</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The leading digits cancel out</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">What remains is mostly rounding noise</text><circle cx="46.0" cy="244" r="3" fill="#1cb0f6"/><text x="58.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">1.000001 - 1.000000 keeps one good digit</text><rect x="316.6666666666667" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="316.6666666666667" y="92" width="266.6666666666667" height="42" rx="12" fill="#ff9600"/><rect x="316.6666666666667" y="118" width="266.6666666666667" height="16" fill="#ff9600"/><text x="450.0" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Loss of trailing digit</text><text x="450.0" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">small value swallowed</text><circle cx="334.6666666666667" cy="166" r="3" fill="#ff9600"/><text x="346.6666666666667" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Adding numbers of very different size</text><circle cx="334.6666666666667" cy="192" r="3" fill="#ff9600"/><text x="346.6666666666667" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The small one is shifted off the end</text><circle cx="334.6666666666667" cy="218" r="3" fill="#ff9600"/><text x="346.6666666666667" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The result equals the larger operand</text><circle cx="334.6666666666667" cy="244" r="3" fill="#ff9600"/><text x="346.6666666666667" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Summing a long list worst-to-best</text><rect x="605.3333333333334" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="605.3333333333334" y="92" width="266.6666666666667" height="42" rx="12" fill="#00b8d4"/><rect x="605.3333333333334" y="118" width="266.6666666666667" height="16" fill="#00b8d4"/><text x="738.6666666666667" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Rounding error</text><text x="738.6666666666667" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">accumulates silently</text><circle cx="623.3333333333334" cy="166" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Every operation rounds to the nearest</text><text x="635.3333333333334" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">representable value</text><circle cx="623.3333333333334" cy="192" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Errors compound over many operations</text><circle cx="623.3333333333334" cy="218" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">0.1 has no exact binary form</text><circle cx="623.3333333333334" cy="244" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Never compare two floats with =</text><rect x="28" y="292" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="319" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The examination asks which effect a given calculation suffers from, so learn to recognise the shape of each.</text></svg>