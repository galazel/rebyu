<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The three-schema view of a database"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="390" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The three-schema view of a database</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Separating the levels lets storage change without rewriting applications.</text><line x1="510.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="510.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">External schema</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="120.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">What each group</text><text x="510.0" y="137.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">of users sees</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Conceptual schema</text><rect x="440.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="219.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">The whole logical</text><text x="510.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">design: entities</text><text x="510.0" y="253.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and relationships</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Internal schema</text><rect x="440.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="510.0" y="327.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">How it is</text><text x="510.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">physically stored</text><text x="510.0" y="361.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and indexed</text></svg>