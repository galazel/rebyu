<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 244" width="900" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The four ACID properties"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="244" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The four ACID properties</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Together they are what makes a database trustworthy for money.</text><rect x="28.0" y="92" width="194.5" height="130" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="194.5" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="194.5" height="16" fill="#1cb0f6"/><text x="125.25" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Atomicity</text><text x="125.25" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">all or nothing</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Every step commits, or none</text><text x="58.0" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">does</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A half-finished transfer is</text><text x="58.0" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">impossible</text><rect x="244.5" y="92" width="194.5" height="130" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="244.5" y="92" width="194.5" height="42" rx="12" fill="#ff9600"/><rect x="244.5" y="118" width="194.5" height="16" fill="#ff9600"/><text x="341.75" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Consistency</text><text x="341.75" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">rules always hold</text><circle cx="262.5" cy="166" r="3" fill="#ff9600"/><text x="274.5" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Constraints are never left</text><text x="274.5" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">broken</text><circle cx="262.5" cy="192" r="3" fill="#ff9600"/><text x="274.5" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The database moves valid state</text><text x="274.5" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">to valid state</text><rect x="461.0" y="92" width="194.5" height="130" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="461.0" y="92" width="194.5" height="42" rx="12" fill="#00b8d4"/><rect x="461.0" y="118" width="194.5" height="16" fill="#00b8d4"/><text x="558.25" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Isolation</text><text x="558.25" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">as if alone</text><circle cx="479.0" cy="166" r="3" fill="#00b8d4"/><text x="491.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Concurrent transactions do not</text><text x="491.0" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">see each other's partial work</text><circle cx="479.0" cy="192" r="3" fill="#00b8d4"/><text x="491.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Locking or versioning enforces</text><text x="491.0" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">it</text><rect x="677.5" y="92" width="194.5" height="130" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="677.5" y="92" width="194.5" height="42" rx="12" fill="#1cb0f6"/><rect x="677.5" y="118" width="194.5" height="16" fill="#1cb0f6"/><text x="774.75" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Durability</text><text x="774.75" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">survives a crash</text><circle cx="695.5" cy="166" r="3" fill="#1cb0f6"/><text x="707.5" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A committed change is on</text><text x="707.5" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">stable storage</text><circle cx="695.5" cy="192" r="3" fill="#1cb0f6"/><text x="707.5" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Write-ahead logging implements</text><text x="707.5" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">it</text></svg>