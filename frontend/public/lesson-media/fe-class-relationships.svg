<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" width="900" height="332" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="How classes relate"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="332" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">How classes relate</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Four relationships in increasing order of commitment.</text><rect x="28.0" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="194.5" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="194.5" height="16" fill="#1cb0f6"/><text x="125.25" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Association</text><text x="125.25" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">knows about</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A plain relationship between</text><text x="58.0" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">two classes</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Neither owns the other</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The default, and the weakest</text><rect x="244.5" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="244.5" y="92" width="194.5" height="42" rx="12" fill="#ff9600"/><rect x="244.5" y="118" width="194.5" height="16" fill="#ff9600"/><text x="341.75" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Aggregation</text><text x="341.75" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">has, loosely</text><circle cx="262.5" cy="166" r="3" fill="#ff9600"/><text x="274.5" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A whole with parts</text><circle cx="262.5" cy="192" r="3" fill="#ff9600"/><text x="274.5" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The parts survive the whole</text><circle cx="262.5" cy="218" r="3" fill="#ff9600"/><text x="274.5" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A team and its members</text><rect x="461.0" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="461.0" y="92" width="194.5" height="42" rx="12" fill="#00b8d4"/><rect x="461.0" y="118" width="194.5" height="16" fill="#00b8d4"/><text x="558.25" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Composition</text><text x="558.25" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">has, and owns</text><circle cx="479.0" cy="166" r="3" fill="#00b8d4"/><text x="491.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A whole with parts it controls</text><circle cx="479.0" cy="192" r="3" fill="#00b8d4"/><text x="491.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The parts do not outlive the</text><text x="491.0" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">whole</text><circle cx="479.0" cy="218" r="3" fill="#00b8d4"/><text x="491.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">An order and its order lines</text><rect x="677.5" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="677.5" y="92" width="194.5" height="42" rx="12" fill="#1cb0f6"/><rect x="677.5" y="118" width="194.5" height="16" fill="#1cb0f6"/><text x="774.75" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Generalisation</text><text x="774.75" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">is a kind of</text><circle cx="695.5" cy="166" r="3" fill="#1cb0f6"/><text x="707.5" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Inheritance -- a subtype of a</text><text x="707.5" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">supertype</text><circle cx="695.5" cy="192" r="3" fill="#1cb0f6"/><text x="707.5" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Everything true of the parent</text><text x="707.5" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">is true of the child</text><circle cx="695.5" cy="218" r="3" fill="#1cb0f6"/><text x="707.5" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A saving account and an</text><text x="707.5" y="236" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">account</text><rect x="28" y="266" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="293" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Aggregation against composition is the examined pair, and the test is lifetime: delete the whole, and ask whether the parts still make sense on their own.</text></svg>