<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Intellectual property in information technology"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="668" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Intellectual property in information technology</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Five rights, protecting five different things.</text><line x1="510.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="510.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="476" x2="510.0" y2="528" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Copyright</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="103.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Programs,</text><text x="510.0" y="120.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">documentation,</text><text x="510.0" y="137.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">databases as</text><text x="510.0" y="154.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">compilations</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Patent</text><rect x="440.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="211.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Technical</text><text x="510.0" y="228.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">inventions, where</text><text x="510.0" y="245.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">the regime</text><text x="510.0" y="262.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">permits</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Trademark</text><rect x="440.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="510.0" y="327.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Product and</text><text x="510.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">service names,</text><text x="510.0" y="361.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and logos</text><text x="28" y="450" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Trade secret</text><rect x="440.0" y="420" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="430" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="435.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Algorithms and</text><text x="510.0" y="452.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">methods kept</text><text x="510.0" y="469.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">confidential</text><text x="28" y="558" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Database rights</text><rect x="440.0" y="528" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="538" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="535.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Investment in</text><text x="510.0" y="552.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">compiling a</text><text x="510.0" y="569.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">database, in some</text><text x="510.0" y="586.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">regimes</text><rect x="28" y="602" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="629" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Software is normally protected by COPYRIGHT, which arises automatically and covers the expression rather than the idea. Everything else in this list applies to specific circumstances rather than generally.</text></svg>