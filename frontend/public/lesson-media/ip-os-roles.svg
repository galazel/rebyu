<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What an operating system manages"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="452" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">What an operating system manages</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Applications ask the OS for resources rather than touching hardware.</text><line x1="450.0" y1="188.0" x2="450.0" y2="134.0" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="72.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="82.0" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="450.0" y="87.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">('Processes', 'Which</text><text x="450.0" y="104.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">program runs, and</text><text x="450.0" y="121.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">when')</text><line x1="541.3014255643347" y1="230.84094634875325" x2="645.9176423568017" y2="214.1540286525061" stroke="#e5e5e5" stroke-width="2"/><rect x="622.8831463671012" y="175.6474508437579" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="622.8831463671012" y="185.6474508437579" width="6" height="36" rx="3" fill="#00b8d4"/><text x="704.8831463671012" y="182.6474508437579" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">('Memory', 'Who gets</text><text x="704.8831463671012" y="199.6474508437579" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">which part, and</text><text x="704.8831463671012" y="216.6474508437579" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">protection between</text><text x="704.8831463671012" y="233.6474508437579" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">them')</text><line x1="506.42738422007744" y1="300.1590536512467" x2="571.0837619722494" y2="343.8459713474939" stroke="#e5e5e5" stroke-width="2"/><rect x="525.5264476143827" y="343.3525491562421" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="525.5264476143827" y="353.3525491562421" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="607.5264476143827" y="358.8525491562421" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">('Files', 'Names,</text><text x="607.5264476143827" y="375.8525491562421" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">folders,</text><text x="607.5264476143827" y="392.8525491562421" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">permissions')</text><line x1="393.57261577992256" y1="300.1590536512467" x2="328.9162380277506" y2="343.8459713474939" stroke="#e5e5e5" stroke-width="2"/><rect x="210.47355238561727" y="343.3525491562421" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="210.47355238561727" y="353.3525491562421" width="6" height="36" rx="3" fill="#ff9600"/><text x="292.47355238561727" y="358.8525491562421" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">('Devices', 'Talking</text><text x="292.47355238561727" y="375.8525491562421" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">to disks, screens,</text><text x="292.47355238561727" y="392.8525491562421" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">networks')</text><line x1="358.69857443566525" y1="230.84094634875328" x2="254.08235764319835" y2="214.1540286525061" stroke="#e5e5e5" stroke-width="2"/><rect x="113.11685363289882" y="175.6474508437579" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="113.11685363289882" y="185.6474508437579" width="6" height="36" rx="3" fill="#ff4b4b"/><text x="195.11685363289882" y="199.6474508437579" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">('Users', 'Accounts,</text><text x="195.11685363289882" y="216.6474508437579" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">logins, rights')</text><ellipse cx="450.0" cy="250" rx="104" ry="62" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="3"/><text x="450.0" y="246" font-size="14" font-weight="800" fill="#4b4b4b" text-anchor="middle">Operating system</text></svg>