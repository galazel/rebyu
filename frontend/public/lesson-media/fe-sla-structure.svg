<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 266" width="900" height="266" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Three layers of service agreement"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="266" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Three layers of service agreement</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Each layer must support the one above it.</text><rect x="28" y="88" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="88" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="116.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">SLA</text><text x="656" y="116.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">with the business -- what they receive</text><rect x="28" y="142" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="142" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="170.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">OLA</text><text x="656" y="170.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">with internal teams -- what each contributes</text><rect x="28" y="196" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="196" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="224.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Underpinning contract</text><text x="656" y="224.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">with suppliers -- what they must provide</text><rect x="688" y="88" width="184" height="154" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="780" y="114" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">An SLA promising four-hour</text><text x="780" y="130" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">restoration, supported by</text><text x="780" y="146" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">a supplier contract</text><text x="780" y="162" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">offering</text><text x="780" y="178" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">next-business-day, cannot</text><text x="780" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">be met. The layers are</text><text x="780" y="210" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">checked against each other</text><text x="780" y="226" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">or the top one is fiction.</text></svg>