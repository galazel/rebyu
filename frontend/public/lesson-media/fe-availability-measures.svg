<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Where the time goes"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Where the time goes</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Availability is uptime over the agreed service period.</text><rect x="28" y="100" width="675.2" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="28" y="100" width="675.2" height="26" rx="12" fill="#1cb0f6"/><rect x="28" y="114" width="675.2" height="12" fill="#1cb0f6"/><text x="365.6" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Uptime</text><text x="365.6" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">service available</text><rect x="703.2" y="100" width="101.28" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="703.2" y="100" width="101.28" height="26" rx="12" fill="#1b6ef3"/><rect x="703.2" y="114" width="101.28" height="12" fill="#1b6ef3"/><text x="753.84" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Planned downtime</text><text x="753.84" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">agreed maintenance</text><rect x="804.48" y="100" width="67.52" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="804.48" y="100" width="67.52" height="26" rx="12" fill="#ff9600"/><rect x="804.48" y="114" width="67.52" height="12" fill="#ff9600"/><text x="838.24" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Unplanned downtime</text><text x="838.24" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">incidents</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Whether PLANNED downtime counts against availability is a definition in the agreement rather than a fact -- and it is the commonest source of two parties disagreeing about whether a target was met.</text></svg>