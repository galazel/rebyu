<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Converting decimal 45 to binary by repeated division"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Converting decimal 45 to binary by repeated division</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Divide by the target base; the remainders are the digits.</text><rect x="28.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="87.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">45 / 2</text><text x="87.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">= 22 r 1</text><line x1="152.0" y1="135.0" x2="168.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="173.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="173.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="232.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">22 / 2</text><text x="232.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">= 11 r 0</text><line x1="297.0" y1="135.0" x2="313.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="318.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="318.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="377.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">11 / 2</text><text x="377.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">= 5 r 1</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="522.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">5 / 2</text><text x="522.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">= 2 r 1</text><line x1="587.0" y1="135.0" x2="603.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="608.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="608.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="667.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">2 / 2</text><text x="667.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">= 1 r 0</text><line x1="732.0" y1="135.0" x2="748.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="753.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="753.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="812.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">1 / 2</text><text x="812.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">= 0 r 1</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Read the remainders BOTTOM to TOP: 101101. Reading them the other way gives 101101 reversed, which is the single most common slip.</text></svg>