<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="An IPv4 address and its mask"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">An IPv4 address and its mask</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The subnet mask says where the boundary falls.</text><rect x="28" y="100" width="474.75" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="28" y="100" width="474.75" height="26" rx="12" fill="#1cb0f6"/><rect x="28" y="114" width="474.75" height="12" fill="#1cb0f6"/><text x="265.375" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Network part</text><text x="265.375" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">which network</text><rect x="502.75" y="100" width="369.25" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="502.75" y="100" width="369.25" height="26" rx="12" fill="#ff9600"/><rect x="502.75" y="114" width="369.25" height="12" fill="#ff9600"/><text x="687.375" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Host part</text><text x="687.375" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">which machine on it</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Moving the boundary right makes more hosts per network and fewer networks; moving it left does the reverse. Two addresses in every subnet are unusable -- the network address and the broadcast.</text></svg>