<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="An incident, end to end"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">An incident, end to end</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Restoration is the goal; the cause is somebody else's process.</text><rect x="28.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="87.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Detect and log</text><text x="87.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">monitoring, or a</text><text x="87.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">user</text><line x1="152.0" y1="135.0" x2="168.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="173.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="173.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="232.5" y="124.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Categorise and</text><text x="232.5" y="141.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">prioritise</text><text x="232.5" y="160.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">impact x urgency</text><line x1="297.0" y1="135.0" x2="313.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="318.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="318.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="377.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Investigate</text><text x="377.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and diagnose</text><text x="377.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">what is actually</text><text x="377.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">wrong</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="522.5" y="124.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Resolve and</text><text x="522.5" y="141.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">recover</text><text x="522.5" y="160.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">service restored</text><line x1="587.0" y1="135.0" x2="603.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="608.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="608.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="667.5" y="118.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Close</text><text x="667.5" y="137.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">with the user</text><text x="667.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">agreeing it is</text><text x="667.5" y="165.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">resolved</text><line x1="732.0" y1="135.0" x2="748.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="753.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="753.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="812.5" y="108.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Feed to</text><text x="812.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">problem</text><text x="812.5" y="142.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">management</text><text x="812.5" y="161.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">if the cause is</text><text x="812.5" y="175.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">unknown</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">PRIORITY comes from impact multiplied by urgency, not from who is asking. Impact is how much of the business is affected; urgency is how fast the damage grows.</text></svg>