 y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="273.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">I1 decode</text><rect x="361.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="431.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">I2 fetch</text><rect x="519.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><rect x="677.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="677.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><rect x="28" y="386" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="413" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Throughput rises towards one instruction per cycle without any single instruction finishing sooner. A branch whose outcome is not yet known forces the partly filled stages to be discarded, which is why branch prediction matters so much.</text></svg>