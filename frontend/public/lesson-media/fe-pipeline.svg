<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="A four-stage pipeline: four instructions in flight at once"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="452" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">A four-stage pipeline: four instructions in flight at once</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Each stage works on a different instruction in the same cycle.</text><line x1="273.0" y1="152" x2="273.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="273.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="273.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="273.0" y1="152" x2="747.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="152" x2="273.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="152" x2="747.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="273.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="747.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="747.0" y1="152" x2="273.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="747.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="747.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e