<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Finding the critical path"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Finding the critical path</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Six steps, and the last one names the activities that matter.</text><rect x="28.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="87.5" y="124.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">List</text><text x="87.5" y="141.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">activities</text><text x="87.5" y="160.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">and their durations</text><line x1="152.0" y1="135.0" x2="168.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="173.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="173.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="232.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Establish</text><text x="232.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">dependencies</text><text x="232.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">what must precede</text><text x="232.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">what</text><line x1="297.0" y1="135.0" x2="313.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="318.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="318.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="377.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Forward pass</text><text x="377.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">earliest each can</text><text x="377.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">start and finish</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="522.5" y="118.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Backward pass</text><text x="522.5" y="137.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">latest each can</text><text x="522.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">start without</text><text x="522.5" y="165.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">delaying the end</text><line x1="587.0" y1="135.0" x2="603.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="608.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="608.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="667.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Float = latest</text><text x="667.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">- earliest</text><text x="667.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">the slack in each</text><text x="667.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">activity</text><line x1="732.0" y1="135.0" x2="748.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="753.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="753.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="812.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Critical path</text><text x="812.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">the activities with</text><text x="812.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">zero float</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">An activity on the critical path delays the whole project if it slips by a day. An activity with five days of float can slip four days and change nothing -- which is why the two are managed completely differently.</text></svg>