<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The OSI reference model"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="482" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The OSI reference model</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Seven layers, each using the one below and serving the one above.</text><rect x="28" y="88" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="88" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="116.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">7 Application</text><text x="656" y="116.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">what the program actually wants</text><rect x="28" y="142" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="142" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="170.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">6 Presentation</text><text x="656" y="170.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">encoding, encryption, compression</text><rect x="28" y="196" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="196" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="224.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">5 Session</text><text x="656" y="224.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">conversations and their state</text><rect x="28" y="250" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="250" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="278.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">4 Transport</text><text x="656" y="278.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">end to end, reliable or not</text><rect x="28" y="304" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="304" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="332.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">3 Network</text><text x="656" y="332.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">addressing and routing between networks</text><rect x="28" y="358" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="358" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="386.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">2 Data link</text><text x="656" y="386.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">frames on one link, and local addressing</text><rect x="28" y="412" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="412" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="440.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">1 Physical</text><text x="656" y="440.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">signals on a medium</text><rect x="688" y="88" width="184" height="370" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="780" y="114" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">TCP/IP collapses these</text><text x="780" y="130" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">into four. Layers 5 to 7</text><text x="780" y="146" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">become one application</text><text x="780" y="162" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">layer, which is why the</text><text x="780" y="178" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">OSI numbers survive as</text><text x="780" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">vocabulary rather than as</text><text x="780" y="210" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">an implemented stack.</text></svg>