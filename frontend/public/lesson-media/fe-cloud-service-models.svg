<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Who manages what"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Who manages what</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">A ladder of responsibility transferred to the provider.</text><line x1="510.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="260" x2="431.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="260" x2="589.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="260" x2="431.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="260" x2="589.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="368" x2="431.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="368" x2="589.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="368" x2="431.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="368" x2="589.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">On premises</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="120.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">You manage</text><text x="510.0" y="137.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">everything</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Infrastructure as a service</text><rect x="361.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="431.0" y="228.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">You manage the OS</text><text x="431.0" y="245.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and above</text><rect x="519.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="589.0" y="228.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Provider manages</text><text x="589.0" y="245.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">the hardware</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Platform as a service</text><rect x="361.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="431.0" y="327.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">You manage the</text><text x="431.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">application and</text><text x="431.0" y="361.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">data</text><rect x="519.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="589.0" y="336.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Provider manages</text><text x="589.0" y="353.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">the platform</text><text x="28" y="450" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Software as a service</text><rect x="361.0" y="420" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="430" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="431.0" y="444.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">You manage your</text><text x="431.0" y="461.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">data and users</text><rect x="519.0" y="420" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="430" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="589.0" y="444.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Provider manages</text><text x="589.0" y="461.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">everything else</text><rect x="28" y="494" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="521" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Responsibility for the DATA never transfers. Whatever the model, the organisation remains accountable for the information it holds -- which is the row every one of these items turns on.</text></svg>