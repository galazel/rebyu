<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Logical shift versus arithmetic shift, on 1011 0000"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="358" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Logical shift versus arithmetic shift, on 1011 0000</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Left shifts are identical; the difference is only on the right.</text><rect x="28.0" y="92" width="411.0" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="411.0" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="411.0" height="16" fill="#1cb0f6"/><text x="233.5" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Logical shift right</text><text x="233.5" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">vacated bits filled with 0</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">1011 0000 becomes 0101 1000</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Treats the pattern as unsigned</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The sign bit is destroyed</text><circle cx="46.0" cy="244" r="3" fill="#1cb0f6"/><text x="58.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Use for bit fields and flags</text><rect x="461.0" y="92" width="411.0" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="461.0" y="92" width="411.0" height="42" rx="12" fill="#ff9600"/><rect x="461.0" y="118" width="411.0" height="16" fill="#ff9600"/><text x="666.5" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Arithmetic shift right</text><text x="666.5" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">sign bit is replicated</text><circle cx="479.0" cy="166" r="3" fill="#ff9600"/><text x="491.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">1011 0000 becomes 1101 1000</text><circle cx="479.0" cy="192" r="3" fill="#ff9600"/><text x="491.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Treats the pattern as a signed number</text><circle cx="479.0" cy="218" r="3" fill="#ff9600"/><text x="491.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Preserves the sign, so -80 stays negative</text><circle cx="479.0" cy="244" r="3" fill="#ff9600"/><text x="491.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Right shift by n divides by 2^n</text><rect x="28" y="292" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="319" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Shifting left by n multiplies by 2^n until a significant bit is pushed off the top, at which point the result is simply wrong.</text></svg>