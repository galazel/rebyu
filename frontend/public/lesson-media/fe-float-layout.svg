<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="IEEE 754 single precision: 32 bits, three fields"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">IEEE 754 single precision: 32 bits, three fields</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Value = (-1)^sign x 1.mantissa x 2^(exponent - 127)</text><rect x="28" y="100" width="26.375" height="74" rx="12" fill="#f7f9fc" stroke="#ff4b4b" stroke-width="2"/><rect x="28" y="100" width="26.375" height="26" rx="12" fill="#ff4b4b"/><rect x="28" y="114" width="26.375" height="12" fill="#ff4b4b"/><text x="41.1875" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">S</text><text x="41.1875" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">1</text><rect x="54.375" y="100" width="211.0" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="54.375" y="100" width="211.0" height="26" rx="12" fill="#ff9600"/><rect x="54.375" y="114" width="211.0" height="12" fill="#ff9600"/><text x="159.875" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Exponent</text><text x="159.875" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">8 bits</text><rect x="265.375" y="100" width="606.625" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="265.375" y="100" width="606.625" height="26" rx="12" fill="#1cb0f6"/><rect x="265.375" y="114" width="606.625" height="12" fill="#1cb0f6"/><text x="568.6875" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Mantissa (fraction)</text><text x="568.6875" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">23 bits</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">S is the sign bit; the exponent is biased by 127; the mantissa's leading 1 is implied, giving 24 bits of precision from 23 stored.</text></svg>