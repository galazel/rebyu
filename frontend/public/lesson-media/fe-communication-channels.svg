<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Why communication cost grows"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="452" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Why communication cost grows</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Channels grow with the SQUARE of the team size.</text><line x1="450.0" y1="188.0" x2="450.0" y2="134.0" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="72.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="82.0" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="450.0" y="96.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">5 people = 10</text><text x="450.0" y="113.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">channels</text><line x1="546.0" y1="250.0" x2="656.0" y2="250.0" stroke="#e5e5e5" stroke-width="2"/><rect x="636.0" y="222.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="636.0" y="232.0" width="6" height="36" rx="3" fill="#00b8d4"/><text x="718.0" y="254.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">10 people = 45</text><line x1="450.0" y1="312.0" x2="450.0" y2="366.0" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="372.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="382.0" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="450.0" y="404.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">20 people = 190</text><line x1="354.0" y1="250.0" x2="244.0" y2="250.00000000000003" stroke="#e5e5e5" stroke-width="2"/><rect x="100.0" y="222.00000000000003" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="100.0" y="232.00000000000003" width="6" height="36" rx="3" fill="#ff9600"/><text x="182.0" y="254.50000000000003" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">50 people = 1,225</text><ellipse cx="450.0" cy="250" rx="104" ry="62" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="3"/><text x="450.0" y="246" font-size="14" font-weight="800" fill="#4b4b4b" text-anchor="middle">n(n-1)/2</text><text x="450.0" y="280" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">which is why large teams need structure</text></svg>