<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Two transports, two contracts"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="358" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Two transports, two contracts</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Reliability is not free, and it is not always wanted.</text><rect x="28.0" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="266.6666666666667" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="266.6666666666667" height="16" fill="#1cb0f6"/><text x="161.33333333333334" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">TCP</text><text x="161.33333333333334" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">reliable and ordered</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Connection established before data</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Lost segments retransmitted</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Order restored, flow controlled</text><circle cx="46.0" cy="244" r="3" fill="#1cb0f6"/><text x="58.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Costs round trips and header space</text><rect x="316.6666666666667" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="316.6666666666667" y="92" width="266.6666666666667" height="42" rx="12" fill="#ff9600"/><rect x="316.6666666666667" y="118" width="266.6666666666667" height="16" fill="#ff9600"/><text x="450.0" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">UDP</text><text x="450.0" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">send and hope</text><circle cx="334.6666666666667" cy="166" r="3" fill="#ff9600"/><text x="346.6666666666667" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">No connection, no state</text><circle cx="334.6666666666667" cy="192" r="3" fill="#ff9600"/><text x="346.6666666666667" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Losses are not detected or repaired</text><circle cx="334.6666666666667" cy="218" r="3" fill="#ff9600"/><text x="346.6666666666667" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">No ordering guarantee at all</text><circle cx="334.6666666666667" cy="244" r="3" fill="#ff9600"/><text x="346.6666666666667" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Minimal overhead, minimal delay</text><rect x="605.3333333333334" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="605.3333333333334" y="92" width="266.6666666666667" height="42" rx="12" fill="#00b8d4"/><rect x="605.3333333333334" y="118" width="266.6666666666667" height="16" fill="#00b8d4"/><text x="738.6666666666667" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Choosing</text><text x="738.6666666666667" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">what does loss mean here</text><circle cx="623.3333333333334" cy="166" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A file transfer cannot lose a byte</text><circle cx="623.3333333333334" cy="192" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">A live voice packet arriving late is</text><text x="635.3333333333334" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">useless</text><circle cx="623.3333333333334" cy="218" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Retransmission helps one and harms the</text><text x="635.3333333333334" y="236" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">other</text><rect x="28" y="292" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="319" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">For real-time media a retransmitted packet arrives after the moment it was needed, so TCP's reliability costs delay and buys nothing -- which is why streaming and voice use UDP.</text></svg>