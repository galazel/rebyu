<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Signing and verifying"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Signing and verifying</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Confidentiality is not what this provides.</text><rect x="28.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="87.5" y="124.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Hash the</text><text x="87.5" y="141.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">message</text><text x="87.5" y="160.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">a fixed-size digest</text><line x1="152.0" y1="135.0" x2="168.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="173.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="173.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="232.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Encrypt the</text><text x="232.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">hash</text><text x="232.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">with the SENDER's</text><text x="232.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">private key</text><line x1="297.0" y1="135.0" x2="313.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="318.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="318.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="377.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Send both</text><text x="377.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">message and</text><text x="377.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">signature</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="522.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Recipient</text><text x="522.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">hashes</text><text x="522.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">the message they</text><text x="522.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">received</text><line x1="587.0" y1="135.0" x2="603.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="608.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="608.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="667.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Decrypt the</text><text x="667.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">signature</text><text x="667.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">with the sender's</text><text x="667.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">public key</text><line x1="732.0" y1="135.0" x2="748.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="753.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="753.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="812.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Compare</text><text x="812.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">equal means genuine</text><text x="812.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">and unaltered</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Signing uses the sender's PRIVATE key -- the reverse of encryption -- because only the sender holds it, and anyone with the public key can check. That reversal is what makes the signature proof of origin.</text></svg>