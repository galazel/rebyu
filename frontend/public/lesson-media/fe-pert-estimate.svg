<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="A three-point estimate"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">A three-point estimate</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">PERT weights the most likely case four times.</text><rect x="28" y="100" width="218.8148148148148" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="28" y="100" width="218.8148148148148" height="26" rx="12" fill="#1cb0f6"/><rect x="28" y="114" width="218.8148148148148" height="12" fill="#1cb0f6"/><text x="137.4074074074074" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Optimistic</text><text x="137.4074074074074" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">everything goes well</text><rect x="246.8148148148148" y="100" width="343.85185185185185" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="246.8148148148148" y="100" width="343.85185185185185" height="26" rx="12" fill="#1b6ef3"/><rect x="246.8148148148148" y="114" width="343.85185185185185" height="12" fill="#1b6ef3"/><text x="418.74074074074076" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Most likely</text><text x="418.74074074074076" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">the realistic case</text><rect x="590.6666666666666" y="100" width="281.3333333333333" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="590.6666666666666" y="100" width="281.3333333333333" height="26" rx="12" fill="#ff9600"/><rect x="590.6666666666666" y="114" width="281.3333333333333" height="12" fill="#ff9600"/><text x="731.3333333333333" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Pessimistic</text><text x="731.3333333333333" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">things go wrong</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">(O + 4M + P) / 6 gives an expected duration that accounts for the pessimistic tail without letting it dominate -- which a simple average would not do.</text></svg>