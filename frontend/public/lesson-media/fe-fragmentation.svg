<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Two kinds of wasted memory"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="516" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Two kinds of wasted memory</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Total free memory can exceed a request that still cannot be met.</text><rect x="28.0" y="92" width="409.0" height="304" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="409.0" height="40" rx="12" fill="#ff9600"/><rect x="28.0" y="118" width="409.0" height="14" fill="#ff9600"/><text x="232.5" y="118" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">External fragmentation</text><rect x="42.0" y="144" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="166" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Used 40K</text><text x="232.5" y="183" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">allocated</text><rect x="42.0" y="206" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="228" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Free 20K</text><text x="232.5" y="245" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">too small for the request</text><rect x="42.0" y="268" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="290" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Used 60K</text><text x="232.5" y="307" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">allocated</text><rect x="42.0" y="330" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="352" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Free 30K</text><text x="232.5" y="369" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">also too small</text><text x="232.5" y="416" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">Free space, but scattered</text><rect x="463.0" y="92" width="409.0" height="304" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="92" width="409.0" height="40" rx="12" fill="#1b6ef3"/><rect x="463.0" y="118" width="409.0" height="14" fill="#1b6ef3"/><text x="667.5" y="118" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Internal fragmentation</text><rect x="477.0" y="144" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="166" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Requested 33K</text><text x="667.5" y="183" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">what was needed</text><rect x="477.0" y="206" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="228" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Allocated 40K</text><text x="667.5" y="245" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">fixed block size</text><rect x="477.0" y="268" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="290" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Wasted 7K</text><text x="667.5" y="307" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">inside the block</text><rect x="477.0" y="330" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="352" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Unusable</text><text x="667.5" y="369" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">by anyone else</text><text x="667.5" y="416" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">Space inside an allocation</text><rect x="28" y="430" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="458" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Paging eliminates external fragmentation by making every block the same size, and accepts a little internal fragmentation in the last page of each allocation as the price.</text></svg>