<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Who publishes what, and at what level"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="374" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Who publishes what, and at what level</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Authority decreases downward; adoption often does not.</text><rect x="28" y="88" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="88" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="116.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">International</text><text x="656" y="116.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">ISO, IEC, ITU -- agreed across nations</text><rect x="28" y="142" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="142" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="170.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Regional</text><text x="656" y="170.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">European and similar bodies</text><rect x="28" y="196" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="196" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="224.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">National</text><text x="656" y="224.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">each country's own standards body</text><rect x="28" y="250" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="250" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="278.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Industry</text><text x="656" y="278.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">consortia and trade associations</text><rect x="28" y="304" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="304" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="332.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">De facto</text><text x="656" y="332.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">what everybody uses, published by nobody</text><rect x="688" y="88" width="184" height="262" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="780" y="114" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">A DE FACTO standard can be</text><text x="780" y="130" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">more binding in practice</text><text x="780" y="146" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">than a published one.</text><text x="780" y="162" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">Nobody mandates it and</text><text x="780" y="178" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">everything already works</text><text x="780" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">with it, which is a</text><text x="780" y="210" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">stronger constraint than a</text><text x="780" y="226" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">rule.</text></svg>