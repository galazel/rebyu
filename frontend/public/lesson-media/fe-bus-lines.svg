<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The three groups of lines in a bus"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The three groups of lines in a bus</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Width matters differently for each group.</text><rect x="28" y="100" width="241.14285714285714" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="28" y="100" width="241.14285714285714" height="26" rx="12" fill="#1cb0f6"/><rect x="28" y="114" width="241.14285714285714" height="12" fill="#1cb0f6"/><text x="148.57142857142856" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Address bus</text><text x="148.57142857142856" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">which location</text><rect x="269.1428571428571" y="100" width="482.2857142857143" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="269.1428571428571" y="100" width="482.2857142857143" height="26" rx="12" fill="#1b6ef3"/><rect x="269.1428571428571" y="114" width="482.2857142857143" height="12" fill="#1b6ef3"/><text x="510.2857142857142" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Data bus</text><text x="510.2857142857142" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">the value itself</text><rect x="751.4285714285713" y="100" width="120.57142857142857" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="751.4285714285713" y="100" width="120.57142857142857" height="26" rx="12" fill="#ff9600"/><rect x="751.4285714285713" y="114" width="120.57142857142857" height="12" fill="#ff9600"/><text x="811.7142857142857" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Control</text><text x="811.7142857142857" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">read/write, timing</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Address width bounds how much memory can be addressed: 32 lines reach 4 GiB. Data width bounds how much moves per transfer. Control lines carry direction, timing and interrupt signals.</text></svg>