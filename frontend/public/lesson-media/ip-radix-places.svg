<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" width="900" height="306" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Place value in four radixes"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="306" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Place value in four radixes</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The same digits mean different values in different radixes.</text><rect x="28" y="92" width="844" height="192" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Radix</text><text x="323.3333333333333" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Places (high to low)</text><text x="604.6666666666666" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">1011 means</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Binary (2)</text><text x="323.3333333333333" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">8  4  2  1</text><text x="604.6666666666666" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">8 + 2 + 1 = 11</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Octal (8)</text><text x="323.3333333333333" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">512  64  8  1</text><text x="604.6666666666666" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">512 + 8 + 1 = 521</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Decimal (10)</text><text x="323.3333333333333" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">1000  100  10  1</text><text x="604.6666666666666" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">1011</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Hex (16)</text><text x="323.3333333333333" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">4096  256  16  1</text><text x="604.6666666666666" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">4096 + 16 + 1 = 4113</text><rect x="28" y="92" width="844" height="192" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/></svg>