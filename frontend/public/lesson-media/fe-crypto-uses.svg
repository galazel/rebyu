<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What each cryptographic tool is FOR"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="452" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">What each cryptographic tool is FOR</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Matching the tool to the property is most of the category.</text><line x1="431.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="431.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="589.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="260" x2="431.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="260" x2="589.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="260" x2="431.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="260" x2="589.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Confidentiality</text><rect x="361.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="431.0" y="120.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Symmetric</text><text x="431.0" y="137.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">encryption</text><rect x="519.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="589.0" y="120.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Asymmetric</text><text x="589.0" y="137.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">encryption</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Integrity</text><rect x="361.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="431.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Hash functions</text><rect x="519.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="589.0" y="219.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Message</text><text x="589.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">authentication</text><text x="589.0" y="253.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">codes</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Authenticity and non-repudiation</text><rect x="361.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="431.0" y="336.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Digital</text><text x="431.0" y="353.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">signatures</text><rect x="519.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="589.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Certificates</text><rect x="28" y="386" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="413" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">A hash gives integrity and not authenticity, since anyone can hash. Encryption gives confidentiality and not integrity, since ciphertext can be altered. Only a signature gives origin.</text></svg>