<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Isolating a network fault"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Isolating a network fault</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Work up the layers -- each step assumes the ones below passed.</text><rect x="28.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="87.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Check the link</text><text x="87.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">is the interface up</text><text x="87.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">at all</text><line x1="152.0" y1="135.0" x2="168.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="173.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="173.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="232.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Check the</text><text x="232.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">address</text><text x="232.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">correct address,</text><text x="232.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">mask, gateway</text><line x1="297.0" y1="135.0" x2="313.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="318.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="318.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="377.5" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Ping the</text><text x="377.5" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">gateway</text><text x="377.5" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">does the local</text><text x="377.5" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">network work</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="522.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Ping beyond it</text><text x="522.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">does routing work</text><line x1="587.0" y1="135.0" x2="603.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="608.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="608.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="667.5" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Resolve a name</text><text x="667.5" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">or is it only DNS</text><line x1="732.0" y1="135.0" x2="748.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="753.0" y="92" width="119.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="753.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="812.5" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Test the port</text><text x="812.5" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">the path works,</text><text x="812.5" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">does the service</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Testing an application before confirming the link inverts this and wastes the effort, because a failure at the top has a dozen causes below it and each lower test eliminates a whole class at once.</text></svg>