<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The three distributions the syllabus names"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="358" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The three distributions the syllabus names</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Poisson counts the events; exponential times the gaps between them.</text><rect x="28.0" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="266.6666666666667" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="266.6666666666667" height="16" fill="#1cb0f6"/><text x="161.33333333333334" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Normal</text><text x="161.33333333333334" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">the bell curve</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Symmetric about the mean</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Describes measurement error and natural</text><text x="58.0" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">variation</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">About 68% within one standard deviation</text><circle cx="46.0" cy="244" r="3" fill="#1cb0f6"/><text x="58.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">About 95% within two</text><rect x="316.6666666666667" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="316.6666666666667" y="92" width="266.6666666666667" height="42" rx="12" fill="#ff9600"/><rect x="316.6666666666667" y="118" width="266.6666666666667" height="16" fill="#ff9600"/><text x="450.0" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Poisson</text><text x="450.0" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">counts in an interval</text><circle cx="334.6666666666667" cy="166" r="3" fill="#ff9600"/><text x="346.6666666666667" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Number of events in a fixed window</text><circle cx="334.6666666666667" cy="192" r="3" fill="#ff9600"/><text x="346.6666666666667" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Arrivals at a server, defects per module</text><circle cx="334.6666666666667" cy="218" r="3" fill="#ff9600"/><text x="346.6666666666667" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Mean and variance are equal</text><circle cx="334.6666666666667" cy="244" r="3" fill="#ff9600"/><text x="346.6666666666667" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Discrete, not continuous</text><rect x="605.3333333333334" y="92" width="266.6666666666667" height="182" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="605.3333333333334" y="92" width="266.6666666666667" height="42" rx="12" fill="#00b8d4"/><rect x="605.3333333333334" y="118" width="266.6666666666667" height="16" fill="#00b8d4"/><text x="738.6666666666667" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Exponential</text><text x="738.6666666666667" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">waiting times</text><circle cx="623.3333333333334" cy="166" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Time until the next event</text><circle cx="623.3333333333334" cy="192" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The gap between Poisson arrivals</text><circle cx="623.3333333333334" cy="218" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Memoryless: waiting longer does not help</text><circle cx="623.3333333333334" cy="244" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">The service-time model in queueing</text><rect x="28" y="292" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="319" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">These three appear together because a Poisson arrival process has exponentially distributed inter-arrival times.</text></svg>