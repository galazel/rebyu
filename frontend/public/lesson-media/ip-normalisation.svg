<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 202" width="900" height="202" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Normalising a table"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="202" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Normalising a table</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Each step removes a way the same fact could be stored twice and disagree.</text><rect x="28.0" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="123.75" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Unnormalised</text><text x="123.75" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">repeating groups in one row</text><line x1="224.5" y1="135.0" x2="240.5" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="245.5" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="245.5" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="341.25" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">1NF</text><text x="341.25" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">one value per cell</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="558.75" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">2NF</text><text x="558.75" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">no dependence on part of a key</text><line x1="659.5" y1="135.0" x2="675.5" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="680.5" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="680.5" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="776.25" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">3NF</text><text x="776.25" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">no dependence between non-key</text><text x="776.25" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">fields</text></svg>