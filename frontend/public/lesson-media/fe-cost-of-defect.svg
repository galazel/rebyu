<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="What a defect costs, by when it is found"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="668" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">What a defect costs, by when it is found</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The same defect, found at five different moments.</text><line x1="510.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="510.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="476" x2="510.0" y2="528" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Requirements</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Change a sentence</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Design</text><rect x="440.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="219.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Change a</text><text x="510.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">document, and the</text><text x="510.0" y="253.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">sentence</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Construction</text><rect x="440.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="510.0" y="327.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Change code,</text><text x="510.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">design and</text><text x="510.0" y="361.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">requirement</text><text x="28" y="450" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Testing</text><rect x="440.0" y="420" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="430" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="444.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">All of the above,</text><text x="510.0" y="461.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">plus retesting</text><text x="28" y="558" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Production</text><rect x="440.0" y="528" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="538" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="543.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">All of it, plus</text><text x="510.0" y="560.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">the damage</text><text x="510.0" y="577.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">already done</text><rect x="28" y="602" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="629" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The cost rises by roughly an order of magnitude per stage, which is the entire economic argument for reviews, static analysis and early testing -- all of which look like delay and are not.</text></svg>