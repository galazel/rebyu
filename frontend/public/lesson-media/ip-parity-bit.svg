<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 273" width="900" height="273" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="A parity bit, and what it misses"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="273" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">A parity bit, and what it misses</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The parity bit is chosen so the count of 1s is even.</text><rect x="28" y="100" width="656.4444444444445" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="28" y="100" width="656.4444444444445" height="26" rx="12" fill="#1cb0f6"/><rect x="28" y="114" width="656.4444444444445" height="12" fill="#1cb0f6"/><text x="356.22222222222223" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Data bits</text><text x="356.22222222222223" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">1 0 1 1 0 0 1</text><rect x="684.4444444444445" y="100" width="187.55555555555554" height="74" rx="12" fill="#f7f9fc" stroke="#00b8d4" stroke-width="2"/><rect x="684.4444444444445" y="100" width="187.55555555555554" height="26" rx="12" fill="#00b8d4"/><rect x="684.4444444444445" y="114" width="187.55555555555554" height="12" fill="#00b8d4"/><text x="778.2222222222222" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Parity</text><text x="778.2222222222222" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">0</text><rect x="28" y="194" width="844" height="57.0" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="217.5" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">One flipped bit makes the count odd and is DETECTED. Two flipped bits make it even again and are MISSED -- parity</text><text x="450.0" y="235.0" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">detects an odd number of errors, and corrects none.</text></svg>