<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Binary search for 23 in a sorted array of 16"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Binary search for 23 in a sorted array of 16</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Each comparison halves what remains.</text><rect x="28.0" y="92" width="264.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="160.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Middle = 30</text><text x="160.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">23 &lt; 30, keep the left half</text><line x1="297.0" y1="135.0" x2="313.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="318.0" y="92" width="264.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="318.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="450.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Middle = 15</text><text x="450.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">23 &gt; 15, keep the right half</text><line x1="587.0" y1="135.0" x2="603.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="608.0" y="92" width="264.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="608.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="740.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Middle = 23</text><text x="740.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">found in 3 comparisons</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Sixteen elements need at most four comparisons, and a million need at most twenty. The array MUST already be sorted -- binary search on unsorted data does not run slowly, it returns wrong answers.</text></svg>