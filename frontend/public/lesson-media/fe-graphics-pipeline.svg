<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The 3D graphics pipeline"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The 3D graphics pipeline</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Every stage runs for every frame, sixty times a second.</text><rect x="28.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="102.0" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Model</text><text x="102.0" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">vertices in object</text><text x="102.0" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">space</text><line x1="181.0" y1="135.0" x2="197.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="202.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="202.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="276.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Transform</text><text x="276.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">position, rotate, scale</text><line x1="355.0" y1="135.0" x2="371.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="376.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="376.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="450.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Project</text><text x="450.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">3D to a 2D viewpoint</text><line x1="529.0" y1="135.0" x2="545.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="550.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="550.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="624.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Rasterise</text><text x="624.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">shapes to pixels</text><line x1="703.0" y1="135.0" x2="719.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="724.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="724.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="798.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Shade</text><text x="798.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">colour, light, texture</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The workload is enormous and highly parallel -- the same operation applied to millions of independent vertices and pixels -- which is exactly what a GPU is built for and what a general processor is not.</text></svg>