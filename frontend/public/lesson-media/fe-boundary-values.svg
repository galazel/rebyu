<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Where defects actually cluster"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Where defects actually cluster</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Test at the boundary, just below it, and just above.</text><rect x="28" y="100" width="324.61538461538464" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="28" y="100" width="324.61538461538464" height="26" rx="12" fill="#ff9600"/><rect x="28" y="114" width="324.61538461538464" height="12" fill="#ff9600"/><text x="190.30769230769232" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Below</text><text x="190.30769230769232" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">invalid</text><rect x="352.61538461538464" y="100" width="194.76923076923077" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="352.61538461538464" y="100" width="194.76923076923077" height="26" rx="12" fill="#1b6ef3"/><rect x="352.61538461538464" y="114" width="194.76923076923077" height="12" fill="#1b6ef3"/><text x="450.0" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">At the boundary</text><text x="450.0" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">the risky values</text><rect x="547.3846153846155" y="100" width="324.61538461538464" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="547.3846153846155" y="100" width="324.61538461538464" height="26" rx="12" fill="#1cb0f6"/><rect x="547.3846153846155" y="114" width="324.61538461538464" height="12" fill="#1cb0f6"/><text x="709.6923076923078" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Above</text><text x="709.6923076923078" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">valid</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Off-by-one errors and wrong comparison operators are among the commonest defects, and both live exactly at the boundary -- so testing the middle of a range finds almost nothing.</text></svg>