<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The marketing mix"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The marketing mix</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Four decisions that must be consistent with one another.</text><line x1="510.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="510.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Product</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="111.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">What is offered,</text><text x="510.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and what it does</text><text x="510.0" y="145.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">for the buyer</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Price</text><rect x="440.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="219.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">What is charged,</text><text x="510.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and how that</text><text x="510.0" y="253.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">positions it</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Place</text><rect x="440.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="510.0" y="336.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">How it reaches</text><text x="510.0" y="353.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">the buyer</text><text x="28" y="450" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Promotion</text><rect x="440.0" y="420" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="430" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="444.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">How the buyer</text><text x="510.0" y="461.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">learns it exists</text><rect x="28" y="494" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="521" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Consistency is what the mix is for. A premium product sold cheaply through discount channels contradicts itself, and buyers read the contradiction as a signal about quality.</text></svg>