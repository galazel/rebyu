<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The memory hierarchy"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="428" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The memory hierarchy</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Faster is smaller and dearer; larger is slower and cheaper.</text><rect x="28" y="88" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="88" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="116.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Registers</text><text x="656" y="116.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">under 1 ns, bytes</text><rect x="28" y="142" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="142" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="170.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">L1 cache</text><text x="656" y="170.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">about 1 ns, tens of KB</text><rect x="28" y="196" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="196" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="224.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">L2 / L3 cache</text><text x="656" y="224.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">3-30 ns, MB</text><rect x="28" y="250" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="250" width="6" height="46" rx="3" fill="#1cb0f6"/><text x="50" y="278.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Main memory (DRAM)</text><text x="656" y="278.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">about 100 ns, GB</text><rect x="28" y="304" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="304" width="6" height="46" rx="3" fill="#1b6ef3"/><text x="50" y="332.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">SSD</text><text x="656" y="332.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">tens of microseconds, TB</text><rect x="28" y="358" width="640" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="358" width="6" height="46" rx="3" fill="#00b8d4"/><text x="50" y="386.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Hard disk</text><text x="656" y="386.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">milliseconds, TB</text><rect x="688" y="88" width="184" height="316" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="780" y="114" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">Each level is roughly ten</text><text x="780" y="130" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">times slower and ten times</text><text x="780" y="146" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">larger than the one above.</text><text x="780" y="162" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">The whole design assumes</text><text x="780" y="178" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">locality: that what was</text><text x="780" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">just used will be used</text><text x="780" y="210" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">again.</text></svg>