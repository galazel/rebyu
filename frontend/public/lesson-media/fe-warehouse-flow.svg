<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="From operational systems to analysis"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">From operational systems to analysis</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">ETL, and the reason a warehouse is separate from the systems it draws on.</text><rect x="28.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="102.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Source systems</text><text x="102.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">day-to-day operations</text><line x1="181.0" y1="135.0" x2="197.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="202.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="202.0" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="276.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Extract</text><text x="276.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">pull the data out</text><line x1="355.0" y1="135.0" x2="371.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="376.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="376.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="450.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Transform</text><text x="450.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">clean and conform it</text><line x1="529.0" y1="135.0" x2="545.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="550.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="550.0" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="624.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Load</text><text x="624.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">into the warehouse</text><line x1="703.0" y1="135.0" x2="719.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="724.0" y="92" width="148.0" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="724.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="798.0" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Analyse</text><text x="798.0" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">reports and mining</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Analytical queries scan enormous ranges and would cripple the operational systems they run against. Separating them lets each be designed for its own access pattern -- normalised for writes, denormalised for reads.</text></svg>