<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Layers of internal control"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="668" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Layers of internal control</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Five components, of which the first determines the rest.</text><line x1="510.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="273.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="431.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="589.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="747.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="273.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="431.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="747.0" y1="368" x2="510.0" y2="420" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="476" x2="510.0" y2="528" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Control environment</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="111.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Tone, culture,</text><text x="510.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and whether rules</text><text x="510.0" y="145.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">are enforced</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Risk assessment</text><rect x="440.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="219.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">What could go</text><text x="510.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">wrong, and how</text><text x="510.0" y="253.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">much it matters</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Control activities</text><rect x="203.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="203.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="273.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Authorisation</text><rect x="361.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="431.0" y="336.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Separation of</text><text x="431.0" y="353.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">duties</text><rect x="519.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="589.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Reconciliation</text><rect x="677.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="677.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="747.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Access control</text><text x="28" y="450" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Information and communication</text><rect x="440.0" y="420" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="430" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="444.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Who knows what,</text><text x="510.0" y="461.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">and when</text><text x="28" y="558" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Monitoring</text><rect x="440.0" y="528" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="538" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="552.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Does any of it</text><text x="510.0" y="569.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">still work</text><rect x="28" y="602" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="629" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The CONTROL ENVIRONMENT is the layer that decides whether the others are real. Controls that senior people routinely bypass are documented rather than operating, and an auditor tests operation rather than documentation.</text></svg>