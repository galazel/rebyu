<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Networks by the area they cover"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="344" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Networks by the area they cover</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The distinction is reach and ownership, not technology.</text><rect x="28" y="92" width="844" height="230" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Type</text><text x="323.3333333333333" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Covers</text><text x="604.6666666666666" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Typical example</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">LAN</text><text x="323.3333333333333" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">One building or site</text><text x="604.6666666666666" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">An office network</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">WAN</text><text x="323.3333333333333" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Cities or countries</text><text x="604.6666666666666" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Links between branches</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Internet</text><text x="323.3333333333333" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Globally</text><text x="604.6666666666666" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">A network of networks</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Intranet</text><text x="323.3333333333333" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">One organisation, privately</text><text x="604.6666666666666" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Internal portal</text><line x1="28" y1="284" x2="872" y2="284" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="308" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">VPN</text><text x="323.3333333333333" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">A private tunnel over a public network</text><text x="604.6666666666666" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Remote working</text><rect x="28" y="92" width="844" height="230" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/></svg>