<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Four ways to hold a collection"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="270" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Four ways to hold a collection</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Choose by the access the task needs, not by which is most familiar.</text><rect x="28.0" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="194.5" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="194.5" height="16" fill="#1cb0f6"/><text x="125.25" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Array</text><text x="125.25" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">index straight to it</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Fixed size, contiguous</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Reading position n is instant</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Inserting means shifting the</text><text x="58.0" y="236" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">rest</text><rect x="244.5" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="244.5" y="92" width="194.5" height="42" rx="12" fill="#ff9600"/><rect x="244.5" y="118" width="194.5" height="16" fill="#ff9600"/><text x="341.75" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">List</text><text x="341.75" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">follow the links</text><circle cx="262.5" cy="166" r="3" fill="#ff9600"/><text x="274.5" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Grows and shrinks freely</text><circle cx="262.5" cy="192" r="3" fill="#ff9600"/><text x="274.5" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Insert is cheap once you are</text><text x="274.5" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">there</text><circle cx="262.5" cy="218" r="3" fill="#ff9600"/><text x="274.5" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Finding position n means</text><text x="274.5" y="236" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">walking</text><rect x="461.0" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="461.0" y="92" width="194.5" height="42" rx="12" fill="#00b8d4"/><rect x="461.0" y="118" width="194.5" height="16" fill="#00b8d4"/><text x="558.25" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Stack</text><text x="558.25" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">last in, first out</text><circle cx="479.0" cy="166" r="3" fill="#00b8d4"/><text x="491.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Push and pop at one end only</text><circle cx="479.0" cy="192" r="3" fill="#00b8d4"/><text x="491.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Undo, and call return</text><text x="491.0" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">addresses</text><circle cx="479.0" cy="218" r="3" fill="#00b8d4"/><text x="491.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Only the top is reachable</text><rect x="677.5" y="92" width="194.5" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="677.5" y="92" width="194.5" height="42" rx="12" fill="#1cb0f6"/><rect x="677.5" y="118" width="194.5" height="16" fill="#1cb0f6"/><text x="774.75" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Queue</text><text x="774.75" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">first in, first out</text><circle cx="695.5" cy="166" r="3" fill="#1cb0f6"/><text x="707.5" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Add at the back, remove at the</text><text x="707.5" y="184" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">front</text><circle cx="695.5" cy="192" r="3" fill="#1cb0f6"/><text x="707.5" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Print jobs, message buffers</text><circle cx="695.5" cy="218" r="3" fill="#1cb0f6"/><text x="707.5" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Order of arrival is preserved</text></svg>