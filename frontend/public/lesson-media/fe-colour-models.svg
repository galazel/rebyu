<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" width="900" height="332" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Two ways to specify a colour"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="332" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Two ways to specify a colour</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Screens emit light; paper reflects it. The models differ accordingly.</text><rect x="28.0" y="92" width="266.6666666666667" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="266.6666666666667" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="266.6666666666667" height="16" fill="#1cb0f6"/><text x="161.33333333333334" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">RGB -- additive</text><text x="161.33333333333334" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">light, for screens</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Red, green and blue light combine</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">All three at full gives white</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">None gives black -- the screen is off</text><rect x="316.6666666666667" y="92" width="266.6666666666667" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="316.6666666666667" y="92" width="266.6666666666667" height="42" rx="12" fill="#ff9600"/><rect x="316.6666666666667" y="118" width="266.6666666666667" height="16" fill="#ff9600"/><text x="450.0" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">CMY(K) -- subtractive</text><text x="450.0" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">ink, for print</text><circle cx="334.6666666666667" cy="166" r="3" fill="#ff9600"/><text x="346.6666666666667" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Cyan, magenta and yellow absorb light</text><circle cx="334.6666666666667" cy="192" r="3" fill="#ff9600"/><text x="346.6666666666667" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">All three gives a muddy near-black, so K</text><text x="346.6666666666667" y="210" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">adds true black</text><circle cx="334.6666666666667" cy="218" r="3" fill="#ff9600"/><text x="346.6666666666667" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">None gives white -- the paper shows</text><text x="346.6666666666667" y="236" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">through</text><rect x="605.3333333333334" y="92" width="266.6666666666667" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="605.3333333333334" y="92" width="266.6666666666667" height="42" rx="12" fill="#00b8d4"/><rect x="605.3333333333334" y="118" width="266.6666666666667" height="16" fill="#00b8d4"/><text x="738.6666666666667" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">HSV / HSB</text><text x="738.6666666666667" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">how people describe colour</text><circle cx="623.3333333333334" cy="166" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Hue, saturation, value</text><circle cx="623.3333333333334" cy="192" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Matches how a person picks a colour</text><circle cx="623.3333333333334" cy="218" r="3" fill="#00b8d4"/><text x="635.3333333333334" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Converted to RGB or CMYK for output</text><rect x="28" y="266" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="293" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">This is why a colour on screen cannot always be printed: the two gamuts do not coincide, and the vivid ones are usually the ones that do not survive.</text></svg>