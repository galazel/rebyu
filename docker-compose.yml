services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - rebyu-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rebyu-net


  backend:
    build:
      context: backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - backend-java/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      AI_SERVICE_URL: http://python-api:8000/api/v1/ai
      BKT_SERVICE_URL: http://python-api:8000/api/v1/bkt
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 2
      SITE_URL: http://localhost:3000
      JAVA_TOOL_OPTIONS: >-
        -Xms128m
        -Xmx384m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseSerialGC
        -XX:MaxRAMPercentage=50
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 100s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - rebyu-net
    develop:
      watch:
        - action: rebuild
          path: ./backend-java/src
        - action: rebuild
          path: ./backend-java/pom.xml

  python-api:
    build:
      context: python-backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - python-backend/.env
    environment:
      DB_SCHEMA: bkt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    volumes:
      - ./python-backend:/app
      - python_artifacts:/app/artifacts
      - model_cache:/root/.cache
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - rebyu-net


  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rebyu-net
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/index.html
        - action: rebuild
          path: ./frontend/package.json

volumes:
  rabbitmq_data:
  python_artifacts:
  model_cache:

networks:
  rebyu-net:
    driver: bridge
    enable_ipv6: true
