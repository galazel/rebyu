name: CI

# The previous version of this file was a template that had never run green: it
# set up Java 17 for a project that needs 21, called `npm test` where no test
# script exists, built a Dockerfile the repository does not contain, ran
# `checkstyle:check` with no checkstyle plugin configured, pushed to a Sonar
# server with no token, and ended by SSHing into deploy@prod.rebyu.com — a host
# that is not this project's (rebyu.online is, and it deploys from Railway on a
# push to main). Every job failed on every push, which is a pipeline that
# reports nothing.
#
# What is left is what this repository can actually prove about itself: that the
# backend compiles, passes its tests and packages, and that the frontend
# type-checks and builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — test and package
    runs-on: ubuntu-latest

    services:
      # The suite includes a @SpringBootTest that starts the whole application,
      # so it needs a real database. Hibernate is on `ddl-auto: update`, so it
      # builds the schema into this empty one at startup; nothing has to be
      # seeded here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rebyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The eight settings in application.yaml that have no default. The
      # credentials are deliberately fake: no test reaches S3, Cognito or SMTP,
      # and the application only needs the properties to resolve for the context
      # to start. Real secrets would buy nothing and would put live keys in a
      # log.
      DB_URL: jdbc:postgresql://localhost:5432/rebyu_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_DATABASE: rebyu_test
      AWS_ACCESS_KEY_ID: ci-not-a-real-key
      AWS_SECRET_ACCESS_KEY: ci-not-a-real-secret
      GOOGLE_APP_PASS: ci-not-a-real-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # 21 because pom.xml sets java.version to 21 and Spring Boot 4.1
          # requires it. The old workflow asked for 17, on which this project
          # does not compile at all.
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test and package
        working-directory: backend-java
        run: ./mvnw -B verify

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend-java/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend — type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the type check as
      # well as the bundle.
      - name: Build
        working-directory: frontend
        run: npm run build

      # Not blocking, on purpose. ESLint currently reports 23 pre-existing
      # errors — almost all `@typescript-eslint/no-explicit-any`, in
      # icons.tsx (which is generated), the theme components and a few hooks.
      # Failing the build on them would leave this pipeline red for reasons
      # that have nothing to do with the change being pushed, which is how the
      # last one became noise. The step still runs, so the count is visible and
      # shrinking it is a change anyone can make; turn this into a blocking step
      # the day it reaches zero.
      - name: Lint (informational)
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
